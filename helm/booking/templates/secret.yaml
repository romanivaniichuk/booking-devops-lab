{{- $password := required "postgres.password is required" .Values.postgres.password }}

apiVersion: v1
kind: Secret
metadata:
  name: booking-postgres
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@booking-postgres:5432/%s" (.Values.postgres.user | urlquery) ($password | urlquery) (.Values.postgres.database | urlquery) | quote }}
