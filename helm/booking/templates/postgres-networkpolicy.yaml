apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-postgres

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application

      ports:
        - protocol: TCP
          port: 5432
