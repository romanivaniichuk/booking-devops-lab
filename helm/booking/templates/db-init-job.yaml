apiVersion: batch/v1
kind: Job
metadata:
  name: booking-db-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-db-init
        app.kubernetes.io/component: database-init

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      containers:
        - name: db-init
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - /bin/sh
            - -c
            - |
              until python -c 'import socket; s=socket.create_connection(("booking-postgres", 5432), 2); s.close()'; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              python -m app.init_db

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-postgres
                  key: DATABASE_URL

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
