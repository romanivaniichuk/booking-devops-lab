apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-postgres
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: booking-postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-postgres
        app.kubernetes.io/component: database

    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: booking-postgres

          ports:
            - name: postgres
              containerPort: 5432

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: booking-postgres
